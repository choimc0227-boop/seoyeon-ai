<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#231b31"><link rel="manifest" href="manifest.webmanifest"><title>두근두근 AI · 서연</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#17131f}*{box-sizing:border-box}body{margin:0}.app{max-width:650px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#251b31,#15121d)}header{padding:15px 17px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff1a}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#59445e}.name{font-weight:800;font-size:18px}.sub{color:#c5b9cb;font-size:12px}.heart{margin-left:auto;color:#ff91b8}main{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 15px;border-radius:18px;max-width:85%;line-height:1.5;white-space:pre-wrap;word-break:break-word}.ai{background:#383044;align-self:flex-start;border-bottom-left-radius:5px}.me{background:#a84878;align-self:flex-end;border-bottom-right-radius:5px}.status{padding:9px 17px;font-size:13px;color:#ffb2ce;background:#ffffff0a}.bar{height:5px;background:#483847;border-radius:9px;margin-top:6px;overflow:hidden}.fill{height:100%;background:#ff80ac;width:10%}footer{display:flex;gap:9px;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:#241c2d}input{flex:1;min-width:0;background:#413448;border:1px solid #655169;color:white;border-radius:25px;padding:13px;font-size:16px}button{background:#f16b9e;color:white;border:0;border-radius:22px;padding:0 18px;font-size:16px;font-weight:700}button:disabled{opacity:.5}.tools{display:flex;justify-content:space-between;gap:8px;padding:9px 17px}.tools button{background:#48354c;padding:8px 11px;font-size:12px}dialog{border:1px solid #68516b;background:#2b2036;color:#fff;border-radius:16px;max-width:90%;width:450px}dialog input{width:100%;margin:8px 0}dialog button{padding:10px}small{color:#b9a9bd}a{color:#ffb4d1}</style></head><body><div class="app"><header><img class="avatar" src="portrait.svg" alt="서연 캐릭터 프로필"><div><div class="name">서연 <span style="font-size:12px;font-weight:400">· 25세</span></div><div class="sub">● 대화할 준비가 됐어 💗</div></div><div class="heart">♥</div></header><div class="status"><span id="relation">처음 만난 사이</span> · 호감도 <span id="score">10</span>/100<div class="bar"><div id="fill" class="fill"></div></div></div><div class="tools"><button id="settings">⚙ AI 연결 설정</button><button id="reset">↺ 대화 초기화</button></div><main id="chat" aria-live="polite"></main><footer><input id="message" placeholder="서연에게 메시지 보내기..." maxlength="1200"><button id="send">전송</button></footer></div><dialog id="config"><h3>AI 연결 설정</h3><p>기본은 무료 체험 모드야. 실제 AI 대화에는 별도로 운영하는 서버가 필요해.</p><label>서버 주소 (HTTPS)</label><input id="endpoint" placeholder="https://your-server.example/chat"><small>서버는 POST JSON {messages, affection}을 받아 JSON {reply}를 반환해야 해. API 키를 이 화면에 입력하지 마.</small><p><button id="save">저장</button> <button id="close">닫기</button></p></dialog><script>const $=id=>document.getElementById(id);const key='seoyeon-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{};if(!state||!Array.isArray(state.messages))state={affection:10,messages:[{role:'assistant',content:'안녕~! 나 서연이야 💕 우리 오늘부터 친하게 지내볼까? ㅎㅎ'}]};let endpoint=localStorage.getItem('seoyeon-endpoint')||'';function persist(){localStorage.setItem(key,JSON.stringify(state))}function draw(){const c=$('chat');c.replaceChildren();for(const m of state.messages){const b=document.createElement('div');b.className='bubble '+(m.role==='user'?'me':'ai');b.textContent=m.content;c.append(b)}$('score').textContent=state.affection;$('fill').style.width=state.affection+'%';$('relation').textContent=state.affection>=75?'서로 설레는 사이':state.affection>=45?'친해지는 중':'처음 만난 사이';c.scrollTop=c.scrollHeight;persist()}const demo=['헤헤, 그런 얘기 해주니까 괜히 웃음 나네 💕','오~ 오늘은 어떤 하루였어? 나한테 들려줘!','너랑 이야기하니까 시간이 금방 가는 것 같아 😊','에이~ 그렇게 장난치면 나도 장난칠 거야! 😜','그랬구나. 좀 더 자세히 말해줄래? 내가 들어줄게 💗','좋아! 우리 천천히 더 알아가자 ㅎㅎ'];let busy=false;async function send(){const v=$('message').value.trim();if(!v||busy)return;busy=true;$('send').disabled=true;$('message').value='';state.messages.push({role:'user',content:v});state.affection=Math.min(100,state.affection+2);draw();let reply;if(endpoint){try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),25000);try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:state.messages.slice(-24),affection:state.affection}),signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(typeof data.reply!=='string'||!data.reply.trim())throw Error('응답 형식 오류');reply=data.reply.trim()}finally{clearTimeout(timeout)}}catch(e){reply='앗, 지금 AI 서버 연결이 안 돼 😢 설정을 확인해줘. ('+e.message+')'}}else{await new Promise(r=>setTimeout(r,450));reply=demo[(state.messages.filter(m=>m.role==='user').length-1)%demo.length]}state.messages.push({role:'assistant',content:reply});draw();busy=false;$('send').disabled=false;$('message').focus()}$('send').onclick=send;$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send()}});$('settings').onclick=()=>{$('endpoint').value=endpoint;$('config').showModal()};$('close').onclick=()=>$('config').close();$('save').onclick=()=>{const val=$('endpoint').value.trim();if(val&&!/^https:\/\//i.test(val)){alert('HTTPS 주소를 입력해줘.');return}endpoint=val;localStorage.setItem('seoyeon-endpoint',endpoint);$('config').close();alert(endpoint?'서버 주소 저장 완료':'체험 모드로 변경 완료')};$('reset').onclick=()=>{if(confirm('대화 기록과 호감도를 초기화할까?')){state={affection:10,messages:[{role:'assistant',content:'안녕~! 나 서연이야 💕 우리 오늘부터 친하게 지내볼까? ㅎㅎ'}]};draw()}};draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
