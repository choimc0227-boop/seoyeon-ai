<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211728"><link rel="manifest" href="manifest.webmanifest"><title>서연 💗 AI 여자친구</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#fff;background:#17111e}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;height:100dvh;min-height:350px;display:flex;flex-direction:column;background:linear-gradient(150deg,#281a31,#17111e 55%)}header{display:flex;align-items:center;gap:12px;padding:13px 16px;padding-top:max(13px,env(safe-area-inset-top));border-bottom:1px solid #ffffff17}.avatar{height:56px;width:56px;object-fit:cover;object-position:center 28%;border-radius:50%;border:2px solid #e880ad}.title{font-weight:800;font-size:18px}.subtitle{color:#d5bfd0;font-size:12px;margin-top:3px}.heart{margin-left:auto;color:#ff86b6;font-size:25px}.score{padding:10px 17px;background:#ffffff08;color:#ffb4d0;font-size:13px}.bar{height:6px;background:#544153;border-radius:8px;overflow:hidden;margin-top:7px}.fill{height:100%;width:10%;background:linear-gradient(90deg,#ff8dbb,#e3478a)}.toolbar{display:flex;gap:8px;padding:10px 14px}.toolbar button{background:#44304b;color:#fff;border:0;border-radius:14px;padding:9px 12px;font-size:13px}.toolbar button:last-child{margin-left:auto}.chat{flex:1;min-height:0;overflow:auto;padding:14px 15px 22px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}.bubble{max-width:84%;padding:12px 15px;border-radius:19px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.ai{align-self:flex-start;background:#3b3046;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#b34d80;border-bottom-right-radius:5px}.notice{align-self:center;font-size:12px;color:#dbc2d4;text-align:center;padding:5px 10px}.composer{display:flex;align-items:center;gap:9px;padding:11px 12px;padding-bottom:max(11px,env(safe-area-inset-bottom));background:#24192d;border-top:1px solid #ffffff15}.composer input{flex:1;min-width:0;border-radius:25px;background:#413249;color:#fff;border:1px solid #67516a;padding:13px 15px;font-size:16px;outline:none}.composer button,.primary{background:#ef6d9e;color:#fff;border:0;border-radius:22px;padding:12px 17px;font-weight:700}.composer button:disabled{opacity:.45}dialog{border:1px solid #75577a;border-radius:20px;background:#2d2036;color:#fff;width:min(92vw,440px);max-height:85dvh;overflow:auto;padding:22px}dialog::backdrop{background:#000a}dialog h2{margin-top:0;font-size:20px}dialog input{width:100%;padding:13px;background:#483750;color:#fff;border:1px solid #755b7a;border-radius:10px;font-size:16px;margin:8px 0 12px}dialog p,dialog small{line-height:1.55;color:#d5c3d7}dialog button{border:0;border-radius:12px;padding:10px 15px;background:#5b4462;color:white;margin:5px 4px 0 0}.photo{display:block;width:100%;max-height:55dvh;object-fit:contain;border-radius:14px}a{color:#ffc0d9}.tag{font-size:11px;color:#eeb6cf} @media(max-width:360px){.toolbar button{font-size:11px;padding:8px}.bubble{font-size:14px}}
</style></head><body><div class="app"><header><img class="avatar" src="seoyeon.jpg" alt="가상의 성인 캐릭터 서연"><div><div class="title">서연 <span class="tag">· 25세 · AI 캐릭터</span></div><div class="subtitle" id="presence">● 대화할 준비가 됐어 💗</div></div><div class="heart">♥</div></header><div class="score"><span id="relation">처음 만난 사이</span> · 호감도 <span id="score">10</span>/100<div class="bar"><div class="fill" id="fill"></div></div></div><div class="toolbar"><button id="photoBtn">📷 서연 사진</button><button id="settingsBtn">⚙ AI 설정</button><button id="resetBtn">↺ 초기화</button></div><main id="chat" class="chat" aria-live="polite"></main><form class="composer" id="form"><input id="message" maxlength="1200" autocomplete="off" placeholder="서연에게 이야기해 줘…" aria-label="메시지"><button id="send" type="submit">전송</button></form></div>
<dialog id="photoDialog"><h2>서연의 사진 💕</h2><img class="photo" src="seoyeon.jpg" alt="AI가 생성한 가상의 성인 여성 서연"><p>AI로 생성한 가상 인물 이미지야. 실제 사람의 사진은 아니야.</p><button data-close="photoDialog">닫기</button></dialog>
<dialog id="settingsDialog"><h2>AI 대화 연결 ⚙</h2><p>AI 서버가 연결되면 서연이 네 메시지에 맞춰 새로운 답변을 만들어. 서버를 연결하지 않으면 무료 체험 답변이 나와.</p><label for="endpoint">Cloudflare Worker 서버 주소</label><input id="endpoint" placeholder="https://seoyeon-chat.계정.workers.dev" inputmode="url"><small>⚠️ OpenAI API 키를 여기에 입력하거나 GitHub에 올리지 마. API 키는 Cloudflare Worker의 Secret으로만 저장해야 해. 채팅 내용은 연결한 서버와 AI 제공업체로 전송돼.</small><p><button class="primary" id="save" type="button">설정 저장</button><button data-close="settingsDialog">닫기</button></p><small id="mode"></small></dialog>
<script>
const $=id=>document.getElementById(id), STORE='seoyeon-v2-state',old='seoyeon-v1';const welcome='안녕~! 나 서연이야 💕 우리 오늘부터 친하게 지내볼까? ㅎㅎ';let state;try{state=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(old)||'null')}catch{}if(!state||!Array.isArray(state.messages))state={affection:10,messages:[{role:'assistant',content:welcome}]};state.affection=Math.min(100,Math.max(0,Number(state.affection)||10));let endpoint=localStorage.getItem('seoyeon-endpoint')||'';const demo=['헤헤, 그런 얘기 해주니까 괜히 웃음 나네 💕','오늘은 어떤 하루였어? 나한테 들려줘!','너랑 이야기하니까 시간이 금방 가는 것 같아 😊','에이~ 그렇게 장난치면 나도 장난칠 거야! 😜','그랬구나. 조금 더 자세히 말해줄래? 💗','좋아! 우리 천천히 더 알아가자 ㅎㅎ'];function saveState(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}}function draw(){const chat=$('chat');chat.replaceChildren();for(const m of state.messages){if(!['assistant','user'].includes(m.role)||typeof m.content!=='string')continue;const b=document.createElement('div');b.className='bubble '+(m.role==='user'?'me':'ai');b.textContent=m.content;chat.append(b)}$('score').textContent=state.affection;$('fill').style.width=state.affection+'%';$('relation').textContent=state.affection>=80?'서로 설레는 사이':state.affection>=45?'점점 가까워지는 사이':state.affection>=20?'친해지는 중':'처음 만난 사이';$('presence').textContent=endpoint?'● AI 연결 모드 💗':'● 무료 체험 모드 💗';chat.scrollTop=chat.scrollHeight;saveState()}let busy=false;async function send(e){e.preventDefault();const msg=$('message').value.trim();if(!msg||busy)return;busy=true;$('send').disabled=true;$('message').value='';state.messages.push({role:'user',content:msg});state.affection=Math.min(100,state.affection+2);draw();let reply='';if(endpoint){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:state.messages.slice(-20),affection:state.affection}),signal:controller.signal});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'서버 오류 '+res.status);if(typeof data.reply!=='string'||!data.reply.trim())throw Error('AI 답변 형식 오류');reply=data.reply.trim().slice(0,1800)}finally{clearTimeout(timer)}}catch(err){reply='앗, AI 연결이 잠깐 안 돼 😢 설정에서 서버 주소를 확인해줘. ('+String(err.message).slice(0,120)+')'}}else{await new Promise(r=>setTimeout(r,350));reply=demo[(state.messages.filter(m=>m.role==='user').length-1)%demo.length]}state.messages.push({role:'assistant',content:reply});draw();busy=false;$('send').disabled=false;$('message').focus()}$('form').addEventListener('submit',send);$('photoBtn').onclick=()=>$('photoDialog').showModal();$('settingsBtn').onclick=()=>{$('endpoint').value=endpoint;$('mode').textContent=endpoint?'현재: AI 서버 주소 설정됨':'현재: 무료 체험 모드';$('settingsDialog').showModal()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('save').onclick=()=>{const val=$('endpoint').value.trim();if(val&&!/^https:\/\/[^\s/]+/i.test(val)){alert('https://로 시작하는 서버 주소를 입력해줘.');return}endpoint=val;localStorage.setItem('seoyeon-endpoint',endpoint);$('settingsDialog').close();draw();alert(endpoint?'AI 서버 주소가 저장됐어!':'무료 체험 모드로 바뀌었어.')};$('resetBtn').onclick=()=>{if(confirm('대화와 호감도를 초기화할까?')){state={affection:10,messages:[{role:'assistant',content:welcome}]};draw()}};draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
